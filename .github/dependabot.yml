version: 2
updates:
  # One grouped PR per week for every workflow action, so hand-pinned majors do
  # not drift onto a deprecated Node runtime unnoticed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
