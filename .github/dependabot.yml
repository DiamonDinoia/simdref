version: 2
updates:
  # One grouped PR per week for every workflow action, so hand-pinned majors do
  # not drift onto a deprecated Node runtime unnoticed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Version updates for the Python side. Dependabot resolves this project as the
  # `uv` ecosystem, matching its `uv.lock`. Security updates run without this
  # entry; ordinary version drift does not.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      python:
        patterns:
          - "*"
